org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
kotlin.incremental=true
kotlin.caching.enabled=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin/JS (:core's js target) installs its npm packages with npm, not Yarn: Yarn would come from a
# project repository, which settings.gradle.kts forbids.
kotlin.js.yarn=false
# The web player's rules (:core js) as one file, so the browser fetches one module.
kotlin.js.ir.output.granularity=whole-program

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
