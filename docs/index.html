<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MWPlayer - Movie Online</title>

  <!-- iOS / iPadOS Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MWPlayer" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="referrer" content="no-referrer" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="icon" type="image/png" href="./icon.png" />

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

  <style>
    :root {
      --bg: #0b0e14;
      --surface: #131822;
      --surface-high: #1c2433;
      --surface-card: #161d2a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #f59e0b;
      --accent-red: #ff5252;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, select {
      user-select: text;
      -webkit-user-select: text;
    }

    .hidden {
      display: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* ================= HEADER (3 ROWS EXACTLY LIKE ANDROID APP) ================= */
    .app-header {
      background: var(--surface);
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 20;
    }

    .header-row-1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(245, 158, 11, 0.16);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .source-switcher {
      display: flex;
      background: var(--surface-high);
      padding: 3px;
      border-radius: 999px;
      gap: 2px;
      border: 1px solid var(--border);
    }

    .source-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .source-btn.active {
      background: var(--accent);
      color: #000;
    }

    .icon-btn {
      background: var(--surface-high);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Row 2: Prominent Full-Width Search Bar */
    .search-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 42px;
      padding: 0 6px 0 12px;
      gap: 8px;
    }

    .search-row:focus-within {
      border-color: var(--accent);
    }

    .search-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      outline: none;
      height: 100%;
      min-width: 0;
    }

    .search-row input::placeholder {
      color: rgba(243, 244, 246, 0.42);
    }

    .search-clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      padding: 4px 6px;
      cursor: pointer;
    }

    .search-submit-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 9px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Row 3: Quick Category Pills + Filter Sheet Trigger */
    .pills-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .pills-row::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 7px 13px;
      border-radius: 16px;
      background: var(--surface-high);
      border: 1px solid var(--border);
      color: rgba(243, 244, 246, 0.88);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 800;
    }

    /* Row 4: Active Filter Tags */
    .active-filters-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .active-filters-row::-webkit-scrollbar {
      display: none;
    }

    .active-tag {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: var(--accent);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* ================= MAIN SCROLL CONTENT ================= */
    .main-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px calc(32px + var(--safe-bottom));
    }

    /* ================= HERO FEATURED CAROUSEL ================= */
    .hero-carousel {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      background: #141a26;
    }

    @media (min-width: 768px) {
      .hero-carousel {
        height: 320px;
      }
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.45s ease;
      pointer-events: none;
      cursor: pointer;
    }

    .hero-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(11,14,20,0.95) 0%, rgba(11,14,20,0.65) 55%, rgba(11,14,20,0.2) 100%),
                  linear-gradient(180deg, rgba(11,14,20,0.1) 0%, rgba(11,14,20,0.95) 100%);
    }

    .hero-content {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 620px;
    }

    .hero-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .hero-badge {
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .hero-badge-sub {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero-title {
        font-size: 26px;
      }
    }

    .hero-origin {
      font-size: 13px;
      color: #d1d5db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-dots {
      position: absolute;
      right: 16px;
      bottom: 18px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .hero-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.2s;
    }

    .hero-dot.active {
      width: 20px;
      background: var(--accent);
    }

    /* ================= HORIZONTAL SHELVES (LIKE ANDROID APP) ================= */
    .shelf-section {
      margin-bottom: 24px;
    }

    .shelf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .shelf-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shelf-more {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
    }

    .shelf-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .shelf-row::-webkit-scrollbar {
      display: none;
    }

    .shelf-row .movie-card {
      width: 142px;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .shelf-row .movie-card {
        width: 165px;
      }
    }

    /* ================= MOVIE CARDS & GRID ================= */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    @media (min-width: 768px) {
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 16px;
      }
    }

    .movie-card {
      background: var(--surface-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
      position: relative;
    }

    .movie-card:active {
      transform: scale(0.97);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #182030;
      overflow: hidden;
    }

    .poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-ep {
      position: absolute;
      top: 7px;
      left: 7px;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      max-width: 76%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-qual {
      position: absolute;
      top: 7px;
      right: 7px;
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .badge-lang {
      position: absolute;
      bottom: 7px;
      left: 7px;
      background: rgba(19, 24, 34, 0.86);
      color: #e5e7eb;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .progress-bar-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
    }

    .card-info {
      padding: 8px 10px 10px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.32;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 34px;
    }

    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= OVERLAYS & MODALS ================= */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 11, 17, 0.97);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 60;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(11, 14, 20, 0.92);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .detail-body {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
    }

    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 68vh;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .player-box video, .player-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .player-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .btn {
      background: var(--surface-high);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .ep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
      gap: 8px;
      margin-top: 10px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .ep-btn {
      padding: 8px 6px;
      border-radius: 9px;
      background: var(--surface-high);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .ep-btn.watched {
      border-color: rgba(245, 158, 11, 0.35);
      color: #d1d5db;
    }

    .ep-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 800;
    }

    /* Bottom Sheet Filter Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-panel {
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      background: var(--surface);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      border: 1px solid var(--border);
      padding: 18px 18px calc(20px + var(--safe-bottom));
      overflow-y: auto;
    }

    .filter-group-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--muted);
      margin: 14px 0 8px;
    }

    .filter-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 26, 38, 0.96);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 200;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      transition: opacity 0.2s;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <div id="app">
    <!-- TOP HEADER (3 ROWS LIKE ANDROID MOVIEPANE) -->
    <div class="app-header">
      <!-- Row 1: Brand + Source Switcher + Backup -->
      <div class="header-row-1">
        <div class="brand-title" onclick="resetAllFilters()">
          <div class="brand-icon">🎬</div>
          <span>Movie Online</span>
        </div>

        <div class="header-actions">
          <div class="source-switcher">
            <button class="source-btn active" id="src-vsmov" onclick="switchSource('VSMov')">VSMov</button>
            <button class="source-btn" id="src-kkphim" onclick="switchSource('KKPhim')">KKPhim</button>
          </div>
          <button class="icon-btn" onclick="openBackupModal()" title="Sao lưu & Khôi phục">💾</button>
        </div>
      </div>

      <!-- Row 2: Full-Width Search Input Bar -->
      <div class="search-row">
        <span style="color:var(--muted);font-size:15px;">🔍</span>
        <input id="search-input" type="search" placeholder="Tìm kiếm phim online (VSMov)..."
          oninput="onSearchInput(this.value)"
          onkeydown="if(event.key==='Enter'){triggerSearchNow()}" />
        <button id="search-clear" class="search-clear-btn hidden" onclick="clearSearch()">✕</button>
        <button class="search-submit-btn" onclick="triggerSearchNow()">Tìm</button>
      </div>

      <!-- Row 3: Filter Button + Quick Category Pills -->
      <div class="pills-row" id="quick-pills-row"></div>

      <!-- Row 4: Active Filter Chips (shown when filters are active) -->
      <div class="active-filters-row hidden" id="active-filters-row"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-scroll" id="main-scroll" onscroll="onMainScroll()">
      <!-- Home View: Featured Hero Carousel + Categorized Horizontal Shelves -->
      <div id="home-shelves-view"></div>

      <!-- Catalog Grid View: Search / Category / Filter / View All -->
      <div id="catalog-grid-view" class="hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <div id="grid-status-title" style="font-size:15px;font-weight:800;color:var(--text);"></div>
          <button id="clear-history-btn" class="btn hidden" onclick="clearAllHistory()">🗑️ Xóa lịch sử</button>
        </div>
        <div class="movie-grid" id="movie-grid"></div>
        <div id="grid-load-more" style="text-align:center;padding:20px;color:var(--muted);font-size:13px;"></div>
      </div>
    </div>
  </div>

  <!-- ADVANCED FILTER BOTTOM SHEET -->
  <div id="filter-sheet" class="sheet-backdrop hidden" onclick="if(event.target===this)closeFilterSheet()">
    <div class="sheet-panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="font-size:17px;font-weight:800;">⚡ Bộ lọc phim đa tiêu chí</div>
        <button class="btn" onclick="closeFilterSheet()">Đóng ✕</button>
      </div>

      <div class="filter-group-title">Danh mục</div>
      <div class="filter-wrap" id="sheet-categories"></div>

      <div class="filter-group-title">Thể loại</div>
      <div class="filter-wrap" id="sheet-genres"></div>

      <div class="filter-group-title">Quốc gia</div>
      <div class="filter-wrap" id="sheet-countries"></div>

      <div class="filter-group-title">Năm phát hành</div>
      <div class="filter-wrap" id="sheet-years"></div>

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn" style="flex:1;justify-content:center;" onclick="resetAllFilters();closeFilterSheet();">Đặt lại</button>
        <button class="btn btn-accent" style="flex:2;justify-content:center;" onclick="closeFilterSheet()">Áp dụng bộ lọc</button>
      </div>
    </div>
  </div>

  <!-- MOVIE DETAIL & PLAYER OVERLAY -->
  <div id="detail-overlay" class="overlay hidden">
    <div class="modal-header">
      <button class="btn" onclick="closeDetail()">← Quay lại</button>
      <div id="detail-header-title" style="font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%;"></div>
      <button class="btn" id="fav-toggle-btn" onclick="toggleCurrentWatchlist()">🤍 Theo dõi</button>
    </div>

    <div class="detail-body">

// ============================================================================
// 4. API FETCHING (KKPhim & VSMov)
// ============================================================================
async function fetchJson(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function fixImg(u, pathImage, cdn) {
  if (!u) return "";
  if (u.startsWith("http://") || u.startsWith("https://")) return u;
  const prefix = (pathImage || cdn || "https://phimimg.com").replace(/\/+$/, "");
  return `${prefix}/${u.replace(/^\/+/, "")}`;
}

function parseMovieList(root, sourceName) {
  if (!root) return { items: [], totalPages: 1 };
  const dObj = root.data || null;
  const itemsArr = (dObj && dObj.items) || root.items || [];
  const cdn = (dObj && dObj.APP_DOMAIN_CDN_IMAGE) || "https://phimimg.com";
  const pathImage = root.pathImage || "";
  const pag = (dObj && dObj.params && dObj.params.pagination) || root.pagination || {};
  const totalPages = pag.totalPages || Math.ceil((pag.totalItems || 24) / (pag.totalItemsPerPage || 24)) || 1;

  const items = itemsArr.map(obj => {
    const thumb = fixImg(obj.thumb_url || obj.poster_url, pathImage, cdn);
    const poster = fixImg(obj.poster_url || obj.thumb_url, pathImage, cdn) || thumb;
    return {
      name: obj.name || "Phim",
      originName: obj.origin_name || "",
      slug: obj.slug || "",
      thumbUrl: thumb,
      posterUrl: poster,
      year: String(obj.year || ""),
      quality: obj.quality || "HD",
      lang: obj.lang || "Vietsub",
      episodeCurrent: obj.episode_current || "",
      source: sourceName,
    };
  });
  return { items, totalPages: Math.max(1, totalPages) };
}

async function getLatestMovies(source, page = 1) {
  const url = source === "KKPhim"
    ? `https://phimapi.com/danh-sach/phim-moi-cap-nhat?page=${page}`
    : `https://vsmov.com/api/danh-sach/phim-moi-cap-nhat?page=${page}`;
  return parseMovieList(await fetchJson(url), source).items;
}

async function getCategoryMovies(source, catSlug, page = 1) {
  let url = "";
  if (source === "KKPhim") {
    url = `https://phimapi.com/v1/api/danh-sach/${catSlug}?page=${page}&limit=18`;
  } else {
    const isGenreRoute = ["hoat-hinh", "co-trang", "hanh-dong", "tinh-cam", "hai-huoc", "tam-ly", "kinh-di", "khoa-hoc-vien-tuong", "vo-thuat", "phieu-luu", "hinh-su"].includes(catSlug);
    const path = isGenreRoute ? `the-loai/${catSlug}` : `danh-sach/${catSlug}`;
    url = `https://vsmov.com/api/${path}?page=${page}`;
  }
  return parseMovieList(await fetchJson(url), source).items;
}

async function getGenreMovies(source, genreSlug, page = 1) {
  const url = source === "KKPhim"
    ? `https://phimapi.com/v1/api/the-loai/${genreSlug}?page=${page}&limit=18`
    : `https://vsmov.com/api/the-loai/${genreSlug}?page=${page}`;
  return parseMovieList(await fetchJson(url), source).items;
}

async function getCountryMovies(source, countrySlug, page = 1) {
  const url = source === "KKPhim"
    ? `https://phimapi.com/v1/api/quoc-gia/${countrySlug}?page=${page}&limit=18`
    : `https://vsmov.com/api/quoc-gia/${countrySlug}?page=${page}`;
  return parseMovieList(await fetchJson(url), source).items;
}

async function filterMoviesApi(source, { category = "", genre = "", country = "", year = "", keyword = "", page = 1 }) {
  let url = "";
  if (source === "KKPhim") {
    const base = "https://phimapi.com/v1/api";
    if (keyword.trim()) {
      url = `${base}/tim-kiem?keyword=${encodeURIComponent(keyword.trim())}&page=${page}&limit=24`;
      if (category) url += `&category=${category}`;
      if (genre) url += `&category=${genre}`;
      if (country) url += `&country=${country}`;
      if (year) url += `&year=${year}`;
    } else if (!category && !genre && !country && !year) {
      url = `https://phimapi.com/danh-sach/phim-moi-cap-nhat?page=${page}`;
    } else {
      const catSlug = category || "phim-bo";
      url = `${base}/danh-sach/${catSlug}?page=${page}&limit=24`;
      if (genre) url += `&category=${genre}`;
      if (country) url += `&country=${country}`;
      if (year) url += `&year=${year}`;
    }
  } else {
    const base = "https://vsmov.com/api";
    if (keyword.trim()) {
      url = `${base}/tim-kiem?keyword=${encodeURIComponent(keyword.trim())}&page=${page}`;
      if (country) url += `&country=${country}`;
      if (year) url += `&year=${year}`;
    } else if (genre) {
      url = `${base}/the-loai/${genre}?page=${page}`;
      if (country) url += `&country=${country}`;
      if (year) url += `&year=${year}`;
    } else if (country) {
      url = `${base}/quoc-gia/${country}?page=${page}`;
      if (year) url += `&year=${year}`;
    } else if (year) {
      url = `${base}/nam/${year}?page=${page}`;
    } else if (category) {
      const path = ["hoat-hinh", "co-trang"].includes(category) ? `the-loai/${category}` : `danh-sach/${category}`;
      url = `${base}/${path}?page=${page}`;
    } else {
      url = `${base}/danh-sach/phim-moi-cap-nhat?page=${page}`;
    }
  }
  return parseMovieList(await fetchJson(url), source);
}

async function loadHomeShelves(forceRefresh = false) {
  const src = state.source;
  const container = document.getElementById("home-shelves-view");

  if (!forceRefresh && state.homeCache[src]) {
    renderHomeShelvesHtml(state.homeCache[src]);
    return;
  }

  container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted);font-weight:700;">⏳ Đang tải kho phim ${src}...</div>`;

  const [
    latestMovies,
    cinemaMovies,
    seriesMovies,
    singleMovies,
    costumeMovies,
    koreaMovies,
    chinaMovies,
    animeMovies,
    subteamMovies
  ] = await Promise.all([
    getLatestMovies(src, 1),
    getCategoryMovies(src, "phim-chieu-rap", 1),
    getCategoryMovies(src, "phim-bo", 1),
    getCategoryMovies(src, "phim-le", 1),
    getGenreMovies(src, "co-trang", 1),
    getCountryMovies(src, "han-quoc", 1),
    getCountryMovies(src, "trung-quoc", 1),
    getCategoryMovies(src, "hoat-hinh", 1),
    src === "VSMov" ? getCategoryMovies(src, "subteam", 1) : Promise.resolve([]),
  ]);

  const data = {
    latestMovies,
    cinemaMovies,
    seriesMovies,
    singleMovies,
    costumeMovies,
    koreaMovies,
    chinaMovies,
    animeMovies,
    subteamMovies,
  };

  if (latestMovies.length > 0) {
    state.homeCache[src] = data;
  }
  renderHomeShelvesHtml(data);
}

function renderHomeShelvesHtml(data) {
  const container = document.getElementById("home-shelves-view");
  let html = "";

  // 1. Featured Hero Carousel (Top 6 Latest Movies)
  const featured = (data.latestMovies || []).slice(0, 6);
  if (featured.length > 0) {
    html += `
      <div class="hero-carousel" id="hero-carousel">
        ${featured.map((m, idx) => {
          const itemJson = encodeURIComponent(JSON.stringify(m));
          const bg = m.thumbUrl || m.posterUrl;
          return `
            <div class="hero-slide ${idx === 0 ? 'active' : ''}" data-idx="${idx}" onclick="openMovieFromCard('${itemJson}')">
              <img class="hero-bg" src="${bg}" alt="${escapeHtml(m.name)}" />
              <div class="hero-gradient"></div>
              <div class="hero-content">
                <div class="hero-badges">
                  <span class="hero-badge">${escapeHtml(m.quality || 'HD')}</span>
                  ${m.lang ? `<span class="hero-badge-sub">${escapeHtml(m.lang)}</span>` : ''}
                  ${m.episodeCurrent ? `<span class="hero-badge-sub">${escapeHtml(m.episodeCurrent)}</span>` : ''}
                  ${m.year ? `<span class="hero-badge-sub">${escapeHtml(m.year)}</span>` : ''}
                </div>
                <div class="hero-title">${escapeHtml(m.name)}</div>
                <div class="hero-origin">${escapeHtml(m.originName || '')}</div>
              </div>
            </div>
          `;
        }).join("")}
        <div class="hero-dots">
          ${featured.map((_, idx) => `<div class="hero-dot ${idx === 0 ? 'active' : ''}" onclick="setHeroSlide(${idx});event.stopPropagation();"></div>`).join("")}
        </div>
      </div>
    `;
  }

  // 2. Watchlist Shelf (⭐ Phim Đang Theo Dõi)
  if ((movieStore.watchlist || []).length > 0) {
    html += renderShelfSection("⭐ Phim Đang Theo Dõi", movieStore.watchlist, "watchlist", "Phim Đang Theo Dõi");
  }

  // 3. History / Continue Watching Shelf (🎬 Phim Xem Gần Đây)
  if ((movieStore.history || []).length > 0) {
    const histItems = movieStore.history.map(recToItem);
    html += renderShelfSection("🎬 Phim Xem Gần Đây", histItems, "history", "Phim Xem Gần Đây");
  }

  // 4. Categorized Shelves (Identical to Android MoviePane)
  if ((data.latestMovies || []).length > 6) {

function renderShelfSection(title, movies, slug, viewAllTitle) {

function startHeroAutoSlide(count) {
  if (state.heroTimer) clearInterval(state.heroTimer);
  if (count <= 1) return;
  state.heroIndex = 0;
  state.heroTimer = setInterval(() => {
    state.heroIndex = (state.heroIndex + 1) % count;
    setHeroSlide(state.heroIndex);
  }, 4500);
}

function setHeroSlide(idx) {
  state.heroIndex = idx;
  document.querySelectorAll(".hero-slide").forEach((el, i) => el.classList.toggle("active", i === idx));

async function loadGridInitial() {
  const grid = document.getElementById("movie-grid");
  const titleEl = document.getElementById("grid-status-title");
  const clearHistBtn = document.getElementById("clear-history-btn");
  const loadMoreEl = document.getElementById("grid-load-more");

  clearHistBtn.classList.add("hidden");
  grid.innerHTML = "";
  loadMoreEl.textContent = "⏳ Đang tải danh sách phim...";

  if (state.selectedCategory === "watchlist") {
    state.gridMovies = movieStore.watchlist || [];
    state.gridPage = 1;
    state.gridTotalPages = 1;
    titleEl.textContent = `⭐ Phim đang theo dõi (${state.gridMovies.length})`;
    grid.innerHTML = state.gridMovies.map(renderMovieCardHtml).join("");
    loadMoreEl.textContent = state.gridMovies.length ? "" : "Chưa có phim trong danh sách theo dõi.";
    return;
  }

  if (state.selectedCategory === "history") {
    state.gridMovies = (movieStore.history || []).map(recToItem);
    state.gridPage = 1;
    state.gridTotalPages = 1;
    titleEl.textContent = `🕒 Lịch sử xem gần đây (${state.gridMovies.length})`;
    if (state.gridMovies.length > 0) clearHistBtn.classList.remove("hidden");
    grid.innerHTML = state.gridMovies.map(renderMovieCardHtml).join("");
    loadMoreEl.textContent = state.gridMovies.length ? "" : "Chưa có phim xem gần đây.";
    return;
  }

  state.isGridLoading = true;
  state.gridPage = 1;
  const res = await fetchGridPage(1);
  state.isGridLoading = false;

  state.gridMovies = res.items;
  state.gridTotalPages = res.totalPages;

  if (state.searchQuery.trim()) {
    titleEl.textContent = `🔍 Kết quả cho "${state.searchQuery.trim()}"`;
  } else if (state.viewAllCategory) {
    titleEl.textContent = `🎬 ${state.viewAllCategory.title}`;
  } else {
    titleEl.textContent = `🎬 Danh sách phim đã lọc`;
  }

  grid.innerHTML = state.gridMovies.map(renderMovieCardHtml).join("");
  loadMoreEl.textContent = !state.gridMovies.length
    ? "Không tìm thấy phim phù hợp."
    : (state.gridPage < state.gridTotalPages ? "Cuộn xuống để tải thêm phim..." : "Đã hiển thị toàn bộ danh sách.");
}

async function fetchGridPage(page) {
  const src = state.source;
  if (state.searchQuery.trim()) {
    return await filterMoviesApi(src, {
      category: state.selectedCategory,
      genre: state.selectedGenre,
      country: state.selectedCountry,
      year: state.selectedYear,
      keyword: state.searchQuery.trim(),
      page,
    });
  }
  if (state.viewAllCategory) {
    const slug = state.viewAllCategory.slug;
    let items = [];
    if (slug === "han-quoc" || slug === "trung-quoc") items = await getCountryMovies(src, slug, page);
    else if (slug === "co-trang") items = await getGenreMovies(src, slug, page);
    else if (slug === "latest") items = await getLatestMovies(src, page);
    else items = await getCategoryMovies(src, slug, page);
    return { items, totalPages: items.length >= 12 ? page + 1 : page };
  }
  return await filterMoviesApi(src, {
    category: state.selectedCategory,
    genre: state.selectedGenre,
    country: state.selectedCountry,
    year: state.selectedYear,
    keyword: "",
    page,
  });
}

async function onMainScroll() {
  if (!isGridActive() || state.isGridLoading || state.isGridLoadingMore) return;
  if (state.selectedCategory === "watchlist" || state.selectedCategory === "history") return;
  if (state.gridPage >= state.gridTotalPages) return;

  const scroller = document.getElementById("main-scroll");
  if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 360) {
    state.isGridLoadingMore = true;
    const nextPage = state.gridPage + 1;
    document.getElementById("grid-load-more").textContent = `⏳ Đang tải thêm trang ${nextPage}...`;
    const res = await fetchGridPage(nextPage);
    state.isGridLoadingMore = false;

    if (res.items.length > 0) {
      const seen = new Set(state.gridMovies.map(m => m.slug));
      const added = res.items.filter(m => !seen.has(m.slug));
      state.gridMovies = [...state.gridMovies, ...added];
      state.gridPage = nextPage;
      state.gridTotalPages = Math.max(state.gridTotalPages, res.totalPages);
      document.getElementById("movie-grid").insertAdjacentHTML("beforeend", added.map(renderMovieCardHtml).join(""));
    }
    document.getElementById("grid-load-more").textContent =
      state.gridPage < state.gridTotalPages ? "Cuộn xuống để tải thêm phim..." : "Đã hiển thị toàn bộ danh sách.";
  }
}

function renderMovieCardHtml(item) {
  const poster = item.posterUrl || item.thumbUrl;
  const badgeEp = item.episodeCurrent || item.year || "";
  const badgeQual = item.quality || "HD";
  const badgeLang = item.lang || "";
  const progressRec = getProgressRecord(item.slug);
  const pct = progressRec && progressRec.durationMs > 0
    ? Math.min(100, Math.round((progressRec.positionMs / progressRec.durationMs) * 100))
    : 0;
  const itemJson = encodeURIComponent(JSON.stringify(item));

  return `
    <div class="movie-card" onclick="openMovieFromCard('${itemJson}')">
      <div class="poster-wrap">
        <img src="${poster}" loading="lazy" alt="${escapeHtml(item.name)}" onerror="this.src='./icon.png'" />
        ${badgeEp ? `<div class="badge-ep">${escapeHtml(badgeEp)}</div>` : ""}
        ${badgeQual ? `<div class="badge-qual">${escapeHtml(badgeQual)}</div>` : ""}
        ${badgeLang ? `<div class="badge-lang">${escapeHtml(badgeLang)}</div>` : ""}
        ${pct > 0 ? `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>` : ""}
      </div>
      <div class="card-info">
        <div class="card-title">${escapeHtml(item.name)}</div>
        <div class="card-sub">${escapeHtml(item.originName || item.year || "")}</div>
      </div>
    </div>
  `;
}

async function openMovieFromCard(encodedItem) {
  const item = JSON.parse(decodeURIComponent(encodedItem));
  await openMovieDetail(item);
}

async function openMovieDetail(item) {
  const overlay = document.getElementById("detail-overlay");
  overlay.classList.remove("hidden");
  document.getElementById("detail-header-title").textContent = item.name;
  document.getElementById("detail-title").textContent = "⏳ Đang tải thông tin và danh sách tập...";
  document.getElementById("detail-meta").textContent = "";
  document.getElementById("detail-actors").textContent = "";
  document.getElementById("detail-desc").textContent = "";
  document.getElementById("server-tabs").innerHTML = "";
  document.getElementById("episode-grid").innerHTML = "";

  const src = item.source === "KKPhim" || item.source === "kkphim" ? "KKPhim" : (item.source === "VSMov" || item.source === "vsmov" ? "VSMov" : state.source);
  let detail = await fetchDetailFromSource(src, item);
  if (!detail) {
    const fallbackSrc = src === "VSMov" ? "KKPhim" : "VSMov";
    detail = await fetchDetailFromSource(fallbackSrc, item);
  }

  if (!detail) {
    showToast("Không tải được chi tiết phim này.");
    return;
  }

  state.currentDetail = detail;
  updateFavButtonUI();

  document.getElementById("detail-title").textContent = `${detail.movie.name} ${detail.movie.originName ? `(${detail.movie.originName})` : ""}`;
  document.getElementById("detail-meta").textContent = [
    detail.movie.year,
    detail.movie.quality,
    detail.movie.lang,
    detail.time,
    (detail.countries || []).join(", "),
    (detail.categories || []).join(" • ")
  ].filter(Boolean).join("  •  ");

  document.getElementById("detail-actors").textContent = (detail.actor && detail.actor.length)
    ? `Diễn viên: ${detail.actor.join(", ")}`
    : "";
  document.getElementById("detail-desc").textContent = detail.content || "";

  const saved = getProgressRecord(detail.movie.slug);
  state.currentServerIdx = saved ? Math.min(saved.serverIndex || 0, Math.max(0, detail.servers.length - 1)) : 0;
  const eps = detail.servers[state.currentServerIdx]?.episodes || [];
  state.currentEpIdx = saved ? Math.min(saved.episodeIndex || 0, Math.max(0, eps.length - 1)) : 0;

  renderServersAndEpisodes();
  playCurrentEpisode(saved?.positionMs || 0);
}

async function fetchDetailFromSource(src, fallbackItem) {
  const key = `${src}:${fallbackItem.slug}`;
  if (state.detailCache[key]) return state.detailCache[key];

  const url = src === "KKPhim"
    ? `https://phimapi.com/phim/${fallbackItem.slug}`
    : `https://vsmov.com/api/phim/${fallbackItem.slug}`;
  const raw = await fetchJson(url);
  if (!raw || !raw.movie) return null;

  const mv = raw.movie;
  const servers = (raw.episodes || []).map(s => ({
    serverName: (s.server_name || "Server #1").replace(/\s+/g, " ").trim(),
    episodes: (s.server_data || []).map(e => ({
      name: e.name || "Tập 1",
      slug: e.slug || "tap-1",
      linkM3u8: e.link_m3u8 || "",
      linkEmbed: e.link_embed || "",
    })),
  })).filter(s => s.episodes.length > 0);

  const detail = {
    movie: {
      ...fallbackItem,
      name: mv.name || fallbackItem.name,
      originName: mv.origin_name || fallbackItem.originName || "",
      year: String(mv.year || fallbackItem.year || ""),
      quality: mv.quality || fallbackItem.quality || "HD",
      lang: mv.lang || fallbackItem.lang || "Vietsub",
      episodeCurrent: mv.episode_current || fallbackItem.episodeCurrent || "",
      source: src,
    },
    content: (mv.content || "").replace(/<[^>]*>/g, "").trim(),
    time: mv.time || "",
    actor: Array.isArray(mv.actor) ? mv.actor.filter(Boolean) : [],
    categories: Array.isArray(mv.category) ? mv.category.map(c => c.name || c).filter(Boolean) : [],
    countries: Array.isArray(mv.country) ? mv.country.map(c => c.name || c).filter(Boolean) : [],
    servers,
  };
  state.detailCache[key] = detail;
  return detail;
}

function renderServersAndEpisodes() {
  const detail = state.currentDetail;
  if (!detail) return;
  document.getElementById("server-tabs").innerHTML = (detail.servers || []).map((s, idx) => `
    <button class="pill ${idx === state.currentServerIdx ? 'active' : ''}" onclick="selectServer(${idx})">
      🖧 ${escapeHtml(s.serverName)}
    </button>
  `).join("");

  const saved = getProgressRecord(detail.movie.slug);
  const watchedSet = new Set(saved?.watchedEpisodes || []);
  const eps = detail.servers[state.currentServerIdx]?.episodes || [];
  document.getElementById("episode-grid").innerHTML = eps.map((ep, idx) => {
    const isCurrent = idx === state.currentEpIdx;
    const isWatched = watchedSet.has(idx) || (saved && saved.episodeIndex === idx);
    return `
      <button class="ep-btn ${isCurrent ? 'active' : (isWatched ? 'watched' : '')}" onclick="selectEpisode(${idx})">
        ${escapeHtml(ep.name)}
      </button>
    `;
  }).join("");
}

function selectServer(sIdx) {
  state.currentServerIdx = sIdx;
  state.currentEpIdx = 0;
  renderServersAndEpisodes();
  playCurrentEpisode(0);
}

function selectEpisode(eIdx) {
  state.currentEpIdx = eIdx;
  renderServersAndEpisodes();
  playCurrentEpisode(0);
}

function setPlayerMode(mode) {
  state.playerMode = mode;
  document.getElementById("mode-embed-btn").classList.toggle("btn-accent", mode === "embed");
  document.getElementById("mode-hls-btn").classList.toggle("btn-accent", mode === "hls");
  playCurrentEpisode(0);
}

function resolveM3u8Url(ep) {
  let m3u8 = (ep.linkM3u8 || "").trim();
  const embed = (ep.linkEmbed || "").trim();
  if (!m3u8 && embed) {
    if (embed.includes("url=")) {
      const rawUrl = embed.split("url=")[1].split("&")[0];
      try { m3u8 = decodeURIComponent(rawUrl); } catch (e) { m3u8 = rawUrl; }
    } else if (embed.includes("/video/")) {
      m3u8 = embed.split("?")[0].replace(/\/+$/, "").replace("/video/", "/stream/") + "/master.m3u8";
    }
  }
  return m3u8;
}

function playCurrentEpisode(resumeMs = 0) {
  const detail = state.currentDetail;
  if (!detail) return;
  const server = detail.servers[state.currentServerIdx];
  const ep = server?.episodes?.[state.currentEpIdx];
  if (!ep) {
    showToast("Chưa có link phát cho tập này.");
    return;
  }

  const embedUrl = (ep.linkEmbed || "").trim();
  const m3u8Url = resolveM3u8Url(ep);

  const iframe = document.getElementById("embed-iframe");
  const video = document.getElementById("hls-video");

  if (state.hlsInstance) {
    state.hlsInstance.destroy();
    state.hlsInstance = null;
  }

  // Default to Embed mode when link_embed is available (or fallback to HLS if no embed)
  const useEmbed = (state.playerMode === "embed" && embedUrl) || (!m3u8Url && embedUrl);

  document.getElementById("mode-embed-btn").classList.toggle("btn-accent", useEmbed);
  document.getElementById("mode-hls-btn").classList.toggle("btn-accent", !useEmbed);

  if (useEmbed) {
    video.pause();
    video.removeAttribute("src");
    video.classList.add("hidden");
    iframe.classList.remove("hidden");
    iframe.src = embedUrl;
  } else if (m3u8Url) {
    iframe.src = "about:blank";
    iframe.classList.add("hidden");
    video.classList.remove("hidden");

    const startSec = resumeMs > 3000 ? Math.floor(resumeMs / 1000) : 0;

    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      state.hlsInstance = hls;
      hls.loadSource(m3u8Url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        if (startSec > 0) video.currentTime = startSec;
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal && embedUrl) {
          showToast("Tự động chuyển sang trình phát Nhúng ổn định...");
          setPlayerMode("embed");
        }
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = m3u8Url;
      video.onloadedmetadata = () => {
        if (startSec > 0 && startSec < video.duration - 10) video.currentTime = startSec;
        video.play().catch(() => {});
      };
      video.onerror = () => {
        if (embedUrl) {
          showToast("Tự động chuyển sang trình phát Nhúng ổn định...");
          setPlayerMode("embed");
        }
      };
    }
  }

  savePlaybackProgress(resumeMs, 0);
}

const videoEl = document.getElementById("hls-video");
let lastSaveTs = 0;
videoEl.addEventListener("timeupdate", () => {
  const now = Date.now();
  if (now - lastSaveTs > 4500 && videoEl.duration > 0) {
    lastSaveTs = now;
    savePlaybackProgress(Math.floor(videoEl.currentTime * 1000), Math.floor(videoEl.duration * 1000));
  }
});
videoEl.addEventListener("ended", () => playNextEpisode());

function togglePiP() {
  if (videoEl.classList.contains("hidden")) {
    setPlayerMode("hls");
    setTimeout(() => requestVideoPiP(), 900);
    return;
  }
  requestVideoPiP();
}

function requestVideoPiP() {
  if (videoEl.webkitSupportsPresentationMode && typeof videoEl.webkitSetPresentationMode === "function") {
    const mode = videoEl.webkitPresentationMode === "picture-in-picture" ? "inline" : "picture-in-picture";
    videoEl.webkitSetPresentationMode(mode);
  } else if (document.pictureInPictureElement) {
    document.exitPictureInPicture().catch(() => {});
  } else if (videoEl.requestPictureInPicture) {
    videoEl.requestPictureInPicture().catch(() => {});
  }
}

function playPrevEpisode() {
  if (state.currentEpIdx > 0) {
    selectEpisode(state.currentEpIdx - 1);
  } else {
    showToast("Đang ở tập đầu tiên.");
  }
}

function playNextEpisode() {
  const detail = state.currentDetail;
  if (!detail) return;
  const eps = detail.servers[state.currentServerIdx]?.episodes || [];
  if (state.currentEpIdx + 1 < eps.length) {
    selectEpisode(state.currentEpIdx + 1);
    showToast(`Đang phát ${eps[state.currentEpIdx].name}`);
  } else {
    showToast("Đã là tập cuối cùng.");
  }
}

function closeDetail() {
  if (state.hlsInstance) {
    state.hlsInstance.destroy();
    state.hlsInstance = null;
  }
  videoEl.pause();
  videoEl.removeAttribute("src");
  document.getElementById("embed-iframe").src = "about:blank";
  document.getElementById("detail-overlay").classList.add("hidden");
  if (!isGridActive() && state.homeCache[state.source]) {
    renderHomeShelvesHtml(state.homeCache[state.source]);
  }
}

// 9. WATCHLIST, HISTORY & BACKUP
// ============================================================================
function getProgressRecord(slug) {
  return (movieStore.history || []).find(r => r.slug === slug);
}

function recToItem(rec) {
  return {
    name: rec.name,
    originName: rec.originName || "",
    slug: rec.slug,
    thumbUrl: rec.thumbUrl || rec.posterUrl || "",
    posterUrl: rec.posterUrl || rec.thumbUrl || "",
    year: rec.year || "",
    quality: rec.quality || "HD",
    lang: rec.lang || "Vietsub",
    episodeCurrent: rec.episodeName ? `Đang xem ${rec.episodeName}` : "",
    source: rec.source || state.source,
  };
}

function savePlaybackProgress(posMs, durMs) {
  const detail = state.currentDetail;
  if (!detail) return;
  const mv = detail.movie;
  const server = detail.servers[state.currentServerIdx];
  const ep = server?.episodes?.[state.currentEpIdx];
  if (!ep) return;

  const existing = getProgressRecord(mv.slug);
  const watchedSet = new Set(existing?.watchedEpisodes || []);
  watchedSet.add(state.currentEpIdx);

  const rec = {
    slug: mv.slug,
    name: mv.name,
    originName: mv.originName || "",
    thumbUrl: mv.thumbUrl || "",
    posterUrl: mv.posterUrl || "",
    year: mv.year || "",
    quality: mv.quality || "HD",
    lang: mv.lang || "Vietsub",
    source: (mv.source || state.source).toLowerCase(),
    serverIndex: state.currentServerIdx,
    episodeIndex: state.currentEpIdx,
    episodeName: ep.name,
    positionMs: Math.max(0, posMs),
    durationMs: Math.max(durMs, existing?.durationMs || 0),
    watchedEpisodes: Array.from(watchedSet),
    updatedAt: Date.now(),
  };

  movieStore.history = [rec, ...(movieStore.history || []).filter(r => r.slug !== mv.slug)].slice(0, 150);
  movieStore.continueWatching = [rec, ...(movieStore.continueWatching || []).filter(r => r.slug !== mv.slug)].slice(0, 60);
  saveStore();
}

function updateFavButtonUI() {
  const slug = state.currentDetail?.movie?.slug;
  const exists = (movieStore.watchlist || []).some(m => m.slug === slug);
  document.getElementById("fav-toggle-btn").textContent = exists ? "❤️ Đã theo dõi" : "🤍 Theo dõi";
}

function toggleCurrentWatchlist() {
  const mv = state.currentDetail?.movie;
  if (!mv) return;
  const exists = (movieStore.watchlist || []).some(m => m.slug === mv.slug);
  if (exists) {
    movieStore.watchlist = movieStore.watchlist.filter(m => m.slug !== mv.slug);
    showToast("Đã xóa khỏi danh sách theo dõi");
  } else {
    movieStore.watchlist = [mv, ...(movieStore.watchlist || [])];
    showToast("⭐ Đã thêm vào danh sách theo dõi");
  }
  saveStore();
  updateFavButtonUI();
}

function clearAllHistory() {
  movieStore.history = [];
  movieStore.continueWatching = [];
  saveStore();
  loadGridInitial();
  showToast("Đã xóa lịch sử xem phim");
}

function openBackupModal() {
  document.getElementById("backup-modal").classList.remove("hidden");
}

function closeBackupModal() {
  document.getElementById("backup-modal").classList.add("hidden");
}

function exportBackup() {
  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const backupObj = {
    format: "tmplayer-backup",
    version: 1,
    createdAt: now.getTime(),
    app: "MWPlayer-Web",
    movieData: movieStore,
  };
  const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `tmplayer-backup-${dateStr}.json`;
  a.click();
  showToast("✅ Đã xuất tệp sao lưu!");
}

function importBackup(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const root = JSON.parse(e.target.result);
      const md = root.movieData || root;
      let count = 0;
      if (Array.isArray(md.watchlist)) {
        const seen = new Set((movieStore.watchlist || []).map(m => m.slug));
        md.watchlist.forEach(m => { if (m.slug && !seen.has(m.slug)) { movieStore.watchlist.push(m); count++; } });
      }
      if (Array.isArray(md.history)) {
        const seen = new Set((movieStore.history || []).map(m => m.slug));
        md.history.forEach(m => { if (m.slug && !seen.has(m.slug)) { movieStore.history.push(m); count++; } });
      }
      saveStore();
      closeBackupModal();
      refreshMainView();
      showToast(`✅ Đã khôi phục ${count} mục dữ liệu phim!`);
    } catch (err) {
      showToast("❌ Tệp sao lưu không hợp lệ.");
    }
  };
  reader.readAsText(file);
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.opacity = "1";
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; }, 2500);
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
</body>
